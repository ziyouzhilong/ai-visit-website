<!DOCTYPE html>
<html style="color-scheme: light dark;">
<head>
  <meta charset="UTF-8">
  <title>Snippet Saver</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="container">
    <!-- Sidebar -->
    <div id="sidebar">
      <div id="tagManagerHeader">
        <h3>Folders</h3>
        <button id="newFolderBtn" class="btn-primary">+ New</button>
      </div>

      <div id="folderTree"></div>
    </div>

    <!-- Main content -->
    <div id="main">

      <!-- Top bar: title + gear icon (moved here in 1.4.1) -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="margin: 0;">Snippets</h2>

        <!-- Gear icon now opens Settings -->
        <button id="openTagManagerBtn"
                title="Settings"
                style="background: none; border: none; cursor: pointer; padding: 4px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14,12.94a7.14,7.14,0,0,0,.05-.94,7.14,7.14,0,0,0-.05-.94l2.11-1.65a.5.5,0,0,0,.12-.63l-2-3.46a.5.5,0,0,0-.6-.22l-2.49,1a7.28,7.28,0,0,0-1.63-.94l-.38-2.65A.5.5,0,0,0,13.7,2H10.3a.5.5,0,0,0-.49.42L9.43,5.07a7.28,7.28,0,0,0-1.63.94l-2.49-1a.5.5,0,0,0-.6.22l-2,3.46a.5.5,0,0,0,.12.63L4.94,11.06a7.14,7.14,0,0,0-.05.94,7.14,7.14,0,0,0,.05.94L2.83,14.59a.5.5,0,0,0-.12.63l2,3.46a.5.5,0,0,0,.6.22l2.49-1a7.28,7.28,0,0,0,1.63.94l.38,2.65a.5.5,0,0,0,.49.42h3.4a.5.5,0,0,0,.49-.42l.38-2.65a7.28,7.28,0,0,0,1.63-.94l2.49,1a.5.5,0,0,0,.6-.22l2-3.46a.5.5,0,0,0-.12-.63ZM12,15.5A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
          </svg>
        </button>
      </div>

      <!-- Search -->
      <div style="margin-bottom: 12px;">
        <input 
          id="searchInput" 
          class="bootstrap-input" 
          placeholder="Search snippets..."
        >
      </div>

      <!-- Sorting -->
      <div style="margin-bottom: 12px; display: flex; justify-content: flex-end;">
        <select id="sortSelect" class="bootstrap-select" style="width: 180px;">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
      </div>

      <!-- Tag Filter Header -->
      <div id="tagFilterArea" style="display: flex; align-items: center; justify-content: space-between;">
        <h4 style="margin: 8px 0 4px;">Filter by tag</h4>
      </div>

      <!-- Tag Chips -->
      <div id="tagFilterChips" style="margin-bottom: 12px;"></div>

      <!-- Snippet List -->
      <ul id="snippetList"></ul>
    </div>
  </div>

  <!-- New Folder Modal -->
  <div id="newFolderModalOverlay" class="modalOverlay" style="display:none;">
    <div class="modal">
      <h3>Create New Folder</h3>

      <label>Parent folder:</label>
      <select id="newFolderParentSelect"></select>

      <label>Folder name:</label>
      <input id="newFolderNameInput" />

      <div class="modal-footer">
        <button id="newFolderCancelBtn" class="btn-secondary">Cancel</button>
        <button id="newFolderCreateBtn" class="btn-primary">Create</button>
      </div>
    </div>
  </div>

  <script src="clipboard.js"></script>
  <script src="popup.js"></script>
</body>
</html>
